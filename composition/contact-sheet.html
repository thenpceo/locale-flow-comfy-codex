<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; background: #101010; color: #f5f5f2; font-family: "Helvetica Neue", sans-serif; }
    main { padding: 38px 42px 34px; }
    header { height: 82px; display: flex; justify-content: space-between; align-items: flex-start; }
    h1 { margin: 0; font-size: 32px; line-height: 1; letter-spacing: -.045em; text-transform: uppercase; }
    .deck { max-width: 770px; margin-top: 8px; color: #a9a9a4; font-size: 13px; line-height: 1.25; }
    .legend { color: #ff1a1a; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; height: 1010px; }
    .card { min-width: 0; display: flex; flex-direction: column; border-top: 2px solid #323232; padding-top: 10px; }
    .card img { width: 100%; height: 920px; object-fit: contain; background: #191919; }
    .meta { margin-top: 10px; display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 10px; }
    .city { font-size: 15px; font-weight: 850; letter-spacing: .02em; text-transform: uppercase; }
    .locale { margin-top: 3px; color: #8f8f8a; font-size: 11px; }
    .status { color: #080808; background: #ff1a1a; padding: 4px 6px 3px; font-size: 10px; font-weight: 850; letter-spacing: .05em; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>City localization control sheet</h1>
        <div class="deck">Each proof combines a protected Nano Banana Pro skyline edit, a newly generated fictional local runner, Comfy compositing, and deterministic localized typography.</div>
      </div>
      <div id="legend" class="legend"></div>
    </header>
    <section id="grid" class="grid"></section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const bytes = Uint8Array.from(atob(params.get('payload') || ''), c => c.charCodeAt(0));
    const data = JSON.parse(new TextDecoder().decode(bytes));
    const grid = document.querySelector('#grid');
    document.querySelector('#legend').textContent = `${data.length} markets · generated in Comfy · human review`;
    for (const item of data) {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<img alt="${item.city} preview" src="${item.image}"><div class="meta"><div><div class="city">${item.city}</div><div class="locale">${item.locale} · ${item.landmarks.join(' / ')}</div></div><div class="status">REVIEW</div></div>`;
      grid.append(card);
    }
  </script>
</body>
</html>
